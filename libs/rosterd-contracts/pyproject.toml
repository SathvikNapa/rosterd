[project]
name = "rosterd-contracts"
version = "0.1.0"
description = "Shared wire-contract types for rosterd services (Priority, RunStatus, SiteStatus, Violation, GraphSpec)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosterd_contracts"]
