# rosterd — local dev / demo compose.
#
# otel-collector + Jaeger are owned by Person 1 (kernel): "stand up the
# containers in compose, define the naming conventions the rest of the
# team follows" (rosterd-sathvik-kernel.md). kernel-site-a, coordinator,
# and spacetimedb (+ spacetimedb-publish) are all real, built/wired
# services now. ingestion, the frontend, and the demo-agent image are each
# that teammate's own build; the commented blocks below are where they
# plug in, not a promise about their shape.
#
# Quick start:
#   docker compose up --build
#   open http://localhost:16686        # Jaeger UI
#   curl  http://localhost:8100/healthz  # kernel
#   curl  http://localhost:8300/healthz  # coordinator
#   spacetime sql rosterd --server http://localhost:3000 "SELECT * FROM agents"
#
# The kernel defaults to ROSTERD_KERNEL_DOCKER_MODE=simulated here, same as
# scripts/run.sh, so `docker compose up` works before Shruti's demo-agent
# image exists and without mounting the host's Docker socket -- every
# dispatched task still runs for real against a real demo-agent process,
# only the container/instance-pool bookkeeping is simulated. Flip to
# `real` (and uncomment the docker.sock mount + rosterd-site-a network)
# once that image is built. See rosterd-kernel/README.md.
#
# The coordinator already knows about kernel-site-a
# (ROSTERD_COORDINATOR_SITE_KERNELS below) -- add a kernel-site-b service
# and extend that map to see a policy pushed to a site that never reported
# the violation itself. See rosterd-coordinator/README.md.
#
# kernel and coordinator both point at the real spacetimedb service now
# (ROSTERD_KERNEL_SPACETIMEDB_URL / ROSTERD_COORDINATOR_SPACETIMEDB_URL
# below) instead of the LoggingSpacetimeWriter stopgap -- see
# rosterd-spacetimedb/README.md for the module itself and how to verify
# writes are landing. Host port 3000 is reserved for it; give the frontend
# placeholder below a different port once it's real.

networks:
  rosterd-backend:
    driver: bridge
  # One isolated network per site; the kernel is the only thing on it
  # that can also reach rosterd-backend (per the brief's isolation
  # requirement -- only the kernel can reach that site's agent pool).
  rosterd-site-a:
    driver: bridge
    internal: true

volumes:
  spacetimedb-data:
  spacetimedb-publish-config:
  jaeger-data:

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./rosterd-kernel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks: [rosterd-backend]
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    # Default storage is in-memory -- every container restart silently
    # wipes trace history, which means any "View trace" link handed out
    # before a restart 404s forever afterward (hit this for real: a link
    # shared mid-session broke the moment the stack got recreated for an
    # unrelated fix). Badger persists it to the mounted volume instead, so
    # trace history survives `docker compose restart` / `down` + `up`
    # (not `down -v`).
    #
    # The image runs as uid 10001 with no /badger baked in, so a fresh
    # named volume (root-owned by default) can't be written to by it --
    # confirmed by watching it fail with "mkdir /badger/key: permission
    # denied". Unlike the spacetimedb service, there's no already-owned
    # directory in this image to mount over instead, so it just runs as
    # root here; this is a local dev/demo box, not a hardened deployment.
    user: root
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger-data:/badger
    ports:
      - "16686:16686" # UI
    networks: [rosterd-backend]

  kernel-site-a:
    build: ./rosterd-kernel
    environment:
      ROSTERD_SITE_ID: site-a
      ROSTERD_KERNEL_OTEL_ENDPOINT: http://otel-collector:4318
      ROSTERD_KERNEL_DOCKER_MODE: simulated
      ROSTERD_KERNEL_SIMULATED_AGENT_URL: http://demo-agent-site-a:8000
      # ROSTERD_KERNEL_DOCKER_NETWORK: rosterd-site-a          # real mode only
      ROSTERD_KERNEL_INGESTION_URL: http://ingestion:8000
      ROSTERD_KERNEL_MANIFEST_ID: ${ROSTERD_MANIFEST_ID:-}     # set after POST /ingest
      ROSTERD_KERNEL_COORDINATOR_URL: http://coordinator:8300
      ROSTERD_KERNEL_SPACETIMEDB_URL: http://spacetimedb:3000
      ROSTERD_KERNEL_SPACETIMEDB_MODULE: rosterd
    ports:
      - "8100:8100"
    networks: [rosterd-backend, rosterd-site-a]
    depends_on:
      otel-collector:
        condition: service_started
      coordinator:
        condition: service_started
      spacetimedb-publish:
        condition: service_completed_successfully
    # Real Docker mode needs the host socket mounted so this container can
    # start/kill its own sibling demo-agent containers:
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock

  coordinator:
    build: ./rosterd-coordinator
    environment:
      ROSTERD_COORDINATOR_OTEL_ENDPOINT: http://otel-collector:4318
      # {site_id: kernel_base_url} -- every kernel this coordinator can push
      # a policy to. Add a site-b entry here once a second kernel exists
      # (see rosterd-coordinator/README.md "Adding a second site").
      ROSTERD_COORDINATOR_SITE_KERNELS: '{"site-a": "http://kernel-site-a:8100"}'
      ROSTERD_COORDINATOR_SPACETIMEDB_URL: http://spacetimedb:3000
      ROSTERD_COORDINATOR_SPACETIMEDB_MODULE: rosterd
    ports:
      - "8300:8300"
    networks: [rosterd-backend]
    depends_on:
      otel-collector:
        condition: service_started
      spacetimedb-publish:
        condition: service_completed_successfully

  # The real SpacetimeDB server (rosterd-spacetimedb/ is the module source).
  # Data lives in the `spacetimedb-data` volume, so it survives a plain
  # `docker compose down` (not a `down -v`).
  spacetimedb:
    image: clockworklabs/spacetime:v2.10.1
    # The published image's entrypoint is the `spacetime` CLI itself (the
    # same tool used locally), not a bare server binary -- it needs `start`
    # explicitly or it just prints usage and exits. Confirmed by watching
    # it do exactly that with no command.
    #
    # The image runs as uid 1000 (`spacetime`), and a fresh named volume
    # mounts root-owned by default -- confirmed by watching `start` fail
    # with "Permission denied" against a volume mounted at /stdb. Mounting
    # under /home/spacetime instead works because that directory already
    # exists in the image owned by uid 1000, and Docker seeds a new
    # volume's initial content (ownership included) from whatever was
    # already at the mount path in the image layer.
    command: ["start", "--listen-addr=0.0.0.0:3000", "--data-dir=/home/spacetime/data"]
    ports:
      - "3000:3000"
    volumes:
      - spacetimedb-data:/home/spacetime
    networks: [rosterd-backend]

  # One-shot: publishes rosterd-spacetimedb/'s module into `spacetimedb`,
  # then exits. kernel-site-a and coordinator both wait on this completing
  # successfully so a fresh `docker compose up` always has the module ready
  # before either service's first write -- see rosterd-spacetimedb/README.md.
  #
  # The CLI auto-generates a fresh identity on first use if none is cached
  # (`/root/.config/spacetime/`), and only the identity that originally
  # created a database may publish updates to it -- confirmed by watching a
  # second `docker compose up` fail with "403 Forbidden: ... is not
  # authorized ... update database" once `rosterd` already existed from a
  # prior run. `spacetimedb-publish-config` persists that directory across
  # container rebuilds so every publish reuses the same identity.
  spacetimedb-publish:
    build: ./rosterd-spacetimedb
    environment:
      ROSTERD_SPACETIMEDB_URL: http://spacetimedb:3000
      ROSTERD_SPACETIMEDB_MODULE: rosterd
    volumes:
      - spacetimedb-publish-config:/root/.config/spacetime
    networks: [rosterd-backend]
    depends_on: [spacetimedb]

  # ---------------------------------------------------------------------
  # Plug in as each teammate's service gets a Dockerfile. Left commented,
  # not stubbed, so `docker compose up` stays green with only the kernel's
  # own pieces until they land.
  # ---------------------------------------------------------------------

  # ingestion:
  #   build: ./rosterd-ingestion
  #   ports: ["8000:8000"]
  #   networks: [rosterd-backend]

  # demo-agent-site-a:
  #   build: ./rosterd-demo-agent
  #   networks: [rosterd-site-a]     # only reachable by kernel-site-a

  # The UI. Served as static files by nginx; the browser talks to the
  # services over the HOST's published ports (that's why the VITE_* build
  # args below are localhost URLs, not compose service names -- see
  # rosterd-frontend/Dockerfile). Host 3000 belongs to spacetimedb, so this
  # takes 5173.
  #
  # ingestion is still not in this file, so the Ingest/Review/Ask screens
  # need `cd rosterd-ingestion && ./scripts/run.sh` alongside this stack.
  frontend:
    build:
      context: ./rosterd-frontend
      args:
        VITE_INGESTION_URL: http://localhost:8000
        VITE_KERNEL_URL: http://localhost:8100
        VITE_COORDINATOR_URL: http://localhost:8300
        VITE_SPACETIMEDB_URL: http://localhost:3000
        VITE_JAEGER_BASE_URL: http://localhost:16686
        VITE_SITE_ID: site-a
    ports:
      - "5173:5173"
    networks: [rosterd-backend]
    depends_on: [kernel-site-a, coordinator]
