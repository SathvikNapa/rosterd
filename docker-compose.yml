# rosterd — local dev / demo compose.
#
# otel-collector + Jaeger, kernel-site-a, coordinator, and postgres are all
# real, built/wired services. ingestion, the frontend, and the demo-agent
# image are each their own build; the commented blocks below are where
# they plug in, not a promise about their shape.
#
# Quick start:
#   docker compose up --build
#   open http://localhost:16686        # Jaeger UI
#   curl  http://localhost:8100/healthz  # kernel
#   curl  http://localhost:8300/healthz  # coordinator
#   psql postgresql://rosterd:rosterd@localhost:5432/rosterd -c "SELECT * FROM agents"
#
# The kernel defaults to ROSTERD_KERNEL_DOCKER_MODE=simulated here, same as
# scripts/run.sh, so `docker compose up` works before the demo-agent image
# exists and without mounting the host's Docker socket -- every dispatched
# task still runs for real against a real demo-agent process, only the
# container/instance-pool bookkeeping is simulated. Flip to `real` (and
# uncomment the docker.sock mount + rosterd-site-a network) once that image
# is built. See rosterd-kernel/README.md.
#
# The coordinator already knows about kernel-site-a
# (ROSTERD_COORDINATOR_SITE_KERNELS below) -- add a kernel-site-b service
# and extend that map to see a policy pushed to a site that never reported
# the violation itself. See rosterd-coordinator/README.md.
#
# kernel and coordinator both write to the real postgres service below
# (ROSTERD_KERNEL_POSTGRES_DSN / ROSTERD_COORDINATOR_POSTGRES_DSN) instead
# of the LoggingStateWriter stopgap -- see rosterd-postgres/README.md for
# the schema and how to verify writes are landing. The coordinator also
# relays every write to the frontend over a plain WebSocket (GET /ws) --
# see adapters/http_in/live_ws.py -- since a browser can't open a raw
# Postgres connection itself.

networks:
  rosterd-backend:
    driver: bridge
  # One isolated network per site; the kernel is the only thing on it
  # that can also reach rosterd-backend (per the brief's isolation
  # requirement -- only the kernel can reach that site's agent pool).
  rosterd-site-a:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  jaeger-data:

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./rosterd-kernel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks: [rosterd-backend]
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    # Default storage is in-memory -- every container restart silently
    # wipes trace history, which means any "View trace" link handed out
    # before a restart 404s forever afterward (hit this for real: a link
    # shared mid-session broke the moment the stack got recreated for an
    # unrelated fix). Badger persists it to the mounted volume instead, so
    # trace history survives `docker compose restart` / `down` + `up`
    # (not `down -v`).
    #
    # The image runs as uid 10001 with no /badger baked in, so a fresh
    # named volume (root-owned by default) can't be written to by it --
    # confirmed by watching it fail with "mkdir /badger/key: permission
    # denied". There's no already-owned directory in this image to mount
    # over instead, so it just runs as root here; this is a local
    # dev/demo box, not a hardened deployment.
    user: root
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger-data:/badger
    ports:
      - "16686:16686" # UI
    networks: [rosterd-backend]

  kernel-site-a:
    build:
      context: .
      dockerfile: rosterd-kernel/Dockerfile
    environment:
      ROSTERD_SITE_ID: site-a
      ROSTERD_KERNEL_OTEL_ENDPOINT: http://otel-collector:4318
      ROSTERD_KERNEL_DOCKER_MODE: simulated
      ROSTERD_KERNEL_SIMULATED_AGENT_URL: http://demo-agent-site-a:8000
      # ROSTERD_KERNEL_DOCKER_NETWORK: rosterd-site-a          # real mode only
      ROSTERD_KERNEL_INGESTION_URL: http://ingestion:8000
      ROSTERD_KERNEL_MANIFEST_ID: ${ROSTERD_MANIFEST_ID:-}     # set after POST /ingest
      ROSTERD_KERNEL_COORDINATOR_URL: http://coordinator:8300
      ROSTERD_KERNEL_POSTGRES_DSN: postgresql://rosterd:rosterd@postgres:5432/rosterd
    ports:
      - "8100:8100"
    networks: [rosterd-backend, rosterd-site-a]
    depends_on:
      otel-collector:
        condition: service_started
      coordinator:
        condition: service_started
      postgres:
        condition: service_healthy
    # Real Docker mode needs the host socket mounted so this container can
    # start/kill its own sibling demo-agent containers:
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock

  coordinator:
    build:
      context: .
      dockerfile: rosterd-coordinator/Dockerfile
    environment:
      ROSTERD_COORDINATOR_OTEL_ENDPOINT: http://otel-collector:4318
      # {site_id: kernel_base_url} -- every kernel this coordinator can push
      # a policy to. Add a site-b entry here once a second kernel exists
      # (see rosterd-coordinator/README.md "Adding a second site").
      ROSTERD_COORDINATOR_SITE_KERNELS: '{"site-a": "http://kernel-site-a:8100"}'
      ROSTERD_COORDINATOR_POSTGRES_DSN: postgresql://rosterd:rosterd@postgres:5432/rosterd
    ports:
      - "8300:8300"
    networks: [rosterd-backend]
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy

  # The shared live-state store (rosterd-postgres/schema.sql is the schema
  # source). Data lives in the `postgres-data` volume, so it survives a
  # plain `docker compose down` (not a `down -v`). schema.sql is mounted
  # into the official image's init-script directory, which the entrypoint
  # runs exactly once, against a fresh (empty) data volume -- a schema
  # change after that needs `docker compose down -v` to take effect, same
  # tradeoff the SpacetimeDB-era publish step this replaces used to have.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rosterd
      POSTGRES_PASSWORD: rosterd
      POSTGRES_DB: rosterd
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./rosterd-postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    networks: [rosterd-backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosterd -d rosterd"]
      interval: 2s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------
  # Plug in as each service gets a Dockerfile. Left commented, not
  # stubbed, so `docker compose up` stays green with only the kernel's
  # own pieces until they land.
  # ---------------------------------------------------------------------

  # ingestion:
  #   build: ./rosterd-ingestion
  #   ports: ["8000:8000"]
  #   networks: [rosterd-backend]

  # demo-agent-site-a:
  #   build: ./rosterd-demo-agent
  #   networks: [rosterd-site-a]     # only reachable by kernel-site-a

  # The UI. Served as static files by nginx; the browser talks to the
  # services over the HOST's published ports (that's why the VITE_* build
  # args below are localhost URLs, not compose service names -- see
  # rosterd-frontend/Dockerfile).
  #
  # ingestion is still not in this file, so the Ingest/Review/Ask screens
  # need `cd rosterd-ingestion && ./scripts/run.sh` alongside this stack.
  frontend:
    build:
      context: ./rosterd-frontend
      args:
        VITE_INGESTION_URL: http://localhost:8000
        VITE_KERNEL_URL: http://localhost:8100
        VITE_COORDINATOR_URL: http://localhost:8300
        VITE_COORDINATOR_WS_URL: ws://localhost:8300/ws
        VITE_JAEGER_BASE_URL: http://localhost:16686
        VITE_SITE_ID: site-a
    ports:
      - "5173:5173"
    networks: [rosterd-backend]
    depends_on: [kernel-site-a, coordinator]
