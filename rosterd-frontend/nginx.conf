server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    # Client-side routing: /review, /runs/abc etc. are not real files, so
    # anything that isn't an asset falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
